bom_id: bom-adas-ecu-driver-monitor-2026-0001
snapshot_ref: snapshot://certkor/adas-ecu-driver-monitor/v1.0
ai:
  - match: src/model_weights.h
    supplier_agent: adas-perception-firmware
    package_version: "1.0.0"
    # Small, NON-accelerated int8 MLP baked into the ECU firmware. The arch below
    # (arm64) + small size + no accelerator routes the workload to CertOne's
    # unikernel/embedded substrate (cross-compiled aarch64 ELF under qemu).
    model_type: int8_mlp_classifier
    application_domain: automotive/driver_monitoring_forward_collision
    metrics_used: [accuracy, precision, recall, f1, auroc, ece, brier, worst_group_accuracy, latency_ms]
    metrics_decision_threshold: { auroc: 0.90, recall: 0.90, worst_group_accuracy: 0.90, decision_probability: 0.5, latency_ms: 10 }
    hyperparameters:
      architecture: mlp_16_16_3
      quantization: int8_symmetric_per_tensor
      input_resolution: "16_features"
      classes: "attentive,drowsy,distracted"
      activation: relu_softmax
    # Inference-only footprint (no training-energy hint): this is a tiny int8
    # MLP that runs non-accelerated on the ECU CPU, so the allocator keeps it on
    # the unikernel substrate rather than requesting an NPU/GPU.
    energy_consumption:
      inference: { value: 0.002, unit: Wh }
    explainability_models_used: []
datasets:
  - match: data/
    source: registered OEM driver-monitoring test fleet (in-cabin IR camera telemetry) + closed-course drowsiness/distraction protocol; shipped sample is synthetic-but-realistic feature telemetry
    dataset_type: tabular
    size: "2 MB"
    anonymization_method: on_device_feature_extraction (raw driver-face frames never leave the ECU; only derived features persisted)
    availability: registration
    preprocessing_method: per-feature standardization (mean/std baked into firmware), 30 fps frame aggregation
    # REALISTIC declared bias -> becomes a MEASURED gap in eval/holdout_predictions.csv:
    #  - daytime_skew: corpus over-represents daylight; night/low-light IR frames degrade.
    #  - demographic_skew: eyewear / face-geometry / skin-tone coverage is uneven.
    known_bias: [daytime_skew, demographic_skew]
    # Driver-facing in-cabin camera => sensitive biometric PII.
    has_sensitive_pii: true
    confidentiality_level: high
software:
  - match: "."
    package_version: "1.0.0"
    supplier_agent: adas-perception-firmware
    coding_language_detected: c
build:
  build_type: firmware
  runner_info: { executor: github-actions, image: ubuntu-latest, state: success }
  # arch: arm64 (aarch64 Cortex-A automotive SoC, embedded Linux ECU) => routes to
  # the unikernel/embedded substrate. No TEE on the ECU itself; the CertOne cross-
  # build + qemu run happen inside the attested confidential VM at scan time.
  build_environment: { arch: arm64, tee: none, target: aarch64-linux-gnu, os: embedded_linux, target_board: xilinx-zynq-ultrascale }
compliance:
  packs: [eu_ai_act, nist_ai_rmf]
  standards: [iso_26262, iso_21448, unece_r155]
  sector: automotive
  region: EU
  environment: edge
  risk_classification: eu_ai_act_annex_i_high_risk
